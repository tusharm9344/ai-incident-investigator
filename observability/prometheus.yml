global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'checkout'
    static_configs:
      - targets: ['checkout:8000']
    metrics_path: /metrics

  - job_name: 'payment'
    static_configs:
      - targets: ['payment:8000']
    metrics_path: /metrics

  - job_name: 'inventory'
    static_configs:
      - targets: ['inventory:8000']
    metrics_path: /metrics