services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incidentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  payment:
    build: ./services/payment
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: incidentdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      PAYMENT_DB_POOL_MAX: 3
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"

  inventory:
    build: ./services/inventory
    ports:
      - "8002:8000"

  checkout:
    build: ./services/checkout
    depends_on:
      - payment
      - inventory
    ports:
      - "8000:8000"